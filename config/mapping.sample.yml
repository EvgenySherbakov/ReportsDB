# ДЕМО-конфиг для синтетических данных (python -m reportsdb sample).
# Рабочий конфиг — config/mapping.yml.
# Маппинг колонок исходных Excel-файлов на модель данных.
# ЕДИНСТВЕННОЕ место, где живут имена колонок. См. docs/TZ.md, разделы 3.3 и 11.
#
# Как заполнять:
#   1. python -m reportsdb profile data/raw/<файл>.xlsx
#   2. Вписать реальные заголовки в списки ниже.
# Сопоставление идёт без учёта регистра и краевых пробелов; «ё» и «е» считаются
# одной буквой. Берётся первый заголовок из списка, который нашёлся в файле.
# Обязательное поле — report_name, остальные необязательны.

reports:
  # Имя листа Excel. null = первый лист в книге.
  sheet: null
  # Номер строки с заголовками, считая с 0 (если сверху есть шапка — увеличить).
  header_row: 0
  columns:
    # Номер строки из исходной таблицы — чтобы находить отчёт в оригинале.
    report_no:
      - "№"
      - "№ п/п"
      - "No"
      - "#"
      - Номер
    report_name:
      - Наименование отчёта
      - Наименование отчета
      - Report
      - Report Name
      - Отчёт
      - Отчет
    # Организационный разрез.
    network:
      - ТС
      - Торговая сеть
      - Сеть
      - Network
    plant:
      - Завод
      - Plant
      - Площадка
    # Путь пользователя к отчёту — тремя уровнями. Полный путь собирается из
    # них автоматически.
    folder_l1:
      - Каталог 1-го уровня
      - Каталог 1 уровня
      - Каталог1
      - Folder 1
    folder_l2:
      - Каталог 2-го уровня
      - Каталог 2 уровня
      - Каталог2
      - Folder 2
    folder_l3:
      - Каталог 3-го уровня
      - Каталог 3 уровня
      - Каталог3
      - Folder 3
    # Запасной вариант: путь одной колонкой. Используется, только если
    # folder_l1…l3 не найдены.
    catalog_path:
      - Каталог
      - Path
      - Catalog
      - Путь
      - Папка
    # Признак «да/нет»: обращается ли отчёт к данным через view.
    uses_view:
      - Используется view
      - Используется вью
      - Uses View
      - View
    source_tables:
      - Таблицы источники данных
      - Таблицы-источники данных
      - Таблицы источников данных
      - Таблицы источников
      - Tables
      - Source Tables
      - Таблицы
      - Источники
    # Статистика использования прямо в основном файле.
    exec_count:
      - Кол-во обращений
      - Количество обращений
      - Кол-во запусков
      - Executions
      - Exec Count
    avg_duration_sec:
      - Ср. дл. (сек)
      - Ср. длительность (сек)
      - Средняя длительность (сек)
      - Avg Duration Sec
    # То же в миллисекундах — при загрузке делится на 1000.
    avg_duration_ms:
      - Avg Duration Ms
      - Ср. дл. (мс)
    description:
      - Description
      - Описание
    owner:
      - Owner
      - Владелец
      - Ответственный
  # Разделитель элементов внутри ячейки со списком таблиц.
  table_separator: ";"

# Размеры таблиц. Ожидается выгрузка сегментов БД: строка на сегмент, у одной
# таблицы сегментов может быть несколько (секции), они суммируются.
table_sizes:
  file: sample_table_sizes.xlsx
  sheet: null
  header_row: 0
  columns:
    schema_name:
      - OWNER
      - Схема
      - Schema
    table_name:
      - SEGMENT_NAME
      - Таблица
      - Table Name
      - Имя таблицы
    # Тип сегмента: TABLE, TABLE PARTITION, INDEX, LOBSEGMENT и т.п.
    # В размер таблицы попадают только сегменты типа TABLE*.
    segment_type:
      - SEGMENT_TYPE
      - Тип сегмента
    # Альтернатива паре schema_name/table_name: «схема.таблица» одной колонкой.
    full_name:
      - Table
      - Full Name
    total_mb:
      - SIZE_MB
      - Total MB
      - TotalMB
      - Размер МБ
      - Итого МБ
    percent_of_total:
      - PERCENT_OF_TOTAL
      - Доля от общего объёма
    row_count:
      - Rows
      - Row Count
      - Строк
      - Количество строк
    data_mb:
      - Data MB
      - DataMB
      - Данные МБ
    index_mb:
      - Index MB
      - IndexMB
      - Индексы МБ
    measured_at:
      - Measured At
      - Дата замера
  # Типы сегментов, которые считаются объёмом таблицы. Остальные (индексы,
  # LOB-сегменты) пропускаются: связать их с таблицей по выгрузке нельзя.
  segment_types: ["TABLE", "TABLE PARTITION", "TABLE SUBPARTITION"]

# Отдельный файл со статистикой использования. Нужен, только если этих данных
# нет в основном файле; загруженное отсюда перекрывает значения из него.
report_usage:
  file: sample_report_usage.xlsx
  sheet: null
  header_row: 0
  columns:
    report_name:
      - Наименование отчёта
      - Наименование отчета
      - Report
      - Report Name
      - Отчёт
      - Отчет
    network:
      - ТС
      - Торговая сеть
    plant:
      - Завод
      - Plant
    catalog_path: # повышает точность сопоставления при одинаковых именах
      - Каталог
      - Path
      - Путь
    exec_count:
      - Кол-во обращений
      - Количество обращений
      - Executions
      - Exec Count
      - Запусков
    distinct_users:
      - Users
      - Distinct Users
      - Пользователей
    avg_duration_sec:
      - Ср. дл. (сек)
      - Средняя длительность (сек)
      - Avg Duration Sec
    avg_duration_ms:
      - Avg Duration Ms
      - Ср. дл. (мс)
    last_executed_at:
      - Last Executed
      - Последний запуск
    period_start:
      - Period Start
      - Начало периода
    period_end:
      - Period End
      - Конец периода
