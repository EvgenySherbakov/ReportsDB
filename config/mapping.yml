# Маппинг колонок исходных Excel-файлов на модель данных.
# ЕДИНСТВЕННОЕ место, где живут имена колонок. См. docs/TZ.md, разделы 3.3 и 11.
#
# Как заполнять:
#   1. python -m reportsdb profile data/raw/<файл>.xlsx
#   2. Вписать реальные заголовки в списки ниже.
# Сопоставление идёт без учёта регистра и краевых пробелов; «ё» и «е» считаются
# одной буквой. Берётся первый заголовок из списка, который нашёлся в файле.
# Обязательное поле — report_name, остальные необязательны.

reports:
  # Имя листа Excel. null = первый лист в книге.
  sheet: null
  # Номер строки с заголовками, считая с 0 (если сверху есть шапка — увеличить).
  header_row: 0
  columns:
    # Номер строки из исходной таблицы — чтобы находить отчёт в оригинале.
    report_no:
      - "№"
      - "№ п/п"
      - "No"
      - "#"
      - Номер
    report_name:
      - Наименование отчёта
      - Наименование отчета
      - Report
      - Report Name
      - Отчёт
      - Отчет
    # Организационный разрез.
    network:
      - ТС
      - Торговая сеть
      - Сеть
      - Network
    plant:
      - Завод
      - Plant
      - Площадка
    # Путь пользователя к отчёту — тремя уровнями. Полный путь собирается из
    # них автоматически.
    folder_l1:
      - Каталог 1-го уровня
      - Каталог 1 уровня
      - Каталог1
      - Folder 1
    folder_l2:
      - Каталог 2-го уровня
      - Каталог 2 уровня
      - Каталог2
      - Folder 2
    folder_l3:
      - Каталог 3-го уровня
      - Каталог 3 уровня
      - Каталог3
      - Folder 3
    # Запасной вариант: путь одной колонкой. Используется, только если
    # folder_l1…l3 не найдены.
    catalog_path:
      - Каталог
      - Path
      - Catalog
      - Путь
      - Папка
    # Признак «да/нет»: обращается ли отчёт к данным через view.
    uses_view:
      - Используется view
      - Используется вью
      - Uses View
    # Объекты-источники. Каждая колонка — свой список через «;», и тип объекта
    # определяется тем, из какой колонки он пришёл. Это надёжнее догадок по
    # имени: таблица V_SALES останется таблицей, если лежит в колонке таблиц.
    source_tables:
      - Таблицы источники данных
      - Таблицы-источники данных
      - Таблицы источников данных
      - Таблицы источников
      - Tables
      - Source Tables
      - Таблицы
      - Источники
    source_views:
      - View
      - Views
      - Представления
      - Используемые view
      - Список view
    source_matviews:
      - Mat.view
      - Mat view
      - Материализованные view
      - Материализованные представления
      - Materialized Views
    source_temp_tables:
      - Временные таблицы
      - Generated tables
      - Tmp tables
      - Временные/generated таблицы
    source_routines:
      - Функции/процедуры
      - Функции и процедуры
      - Процедуры
      - Функции
      - Functions
      - Procedures
    # Статистика использования (exec_count, avg_duration_sec) сюда НЕ входит:
    # даже если в файле есть такие колонки, они не читаются. Частота и
    # длительность приходят только из отдельного файла — раздел report_usage
    # ниже.
    description:
      - Description
      - Описание
    owner:
      - Owner
      - Владелец
      - Ответственный
  # Разделитель элементов внутри ячейки со списком объектов.
  table_separator: ";"
  # Маски имён для распознавания типа объекта в колонке таблиц. ПУСТО по
  # умолчанию и это намеренно: неверно угаданный тип молча выкинет таблицу из
  # аналитики. Заполнять, только если отдельных колонок по типам не будет.
  # Пример:
  #   object_patterns:
  #     VIEW: ["V_*", "VW_*"]
  #     MATERIALIZED VIEW: ["MV_*"]
  #     TEMP: ["TMP_*", "TEMP_*", "GT_*"]
  #
  # Маска — последняя догадка, и работает она только для колонки
  # «Таблицы источники данных». Объект из явной колонки (View, Mat.view,
  # Временные, Функции/процедуры) сохраняет свой тип, и объект, найденный в
  # файле размеров, тоже: у него есть сегменты, значит он физически хранится
  # и это таблица, как бы она ни называлась.
  #
  # В справочнике «Таблицы» такие объекты помечены источником типа «маска».
  object_patterns:
    VIEW: ["V_*", "VW_*"]

# Размеры таблиц. Ожидается выгрузка сегментов БД: строка на сегмент, у одной
# таблицы сегментов может быть несколько (секции), они суммируются.
table_sizes:
  # Один файл — `file: sizes.xlsx`, несколько (по файлу на завод) —
  # `files: [sizes_zavod1.xlsx, sizes_zavod2.xlsx]`. В интерфейсе выбор
  # файлов множественный, и этот ключ там не нужен.
  file: null # напр. table_sizes.xlsx
  sheet: null
  header_row: 0
  columns:
    # Организационный разрез: размер одной таблицы на разных заводах разный.
    # Если этих колонок нет, все строки считаются общими для всех заводов.
    network:
      - ТС
      - Торговая сеть
      - Сеть
    plant:
      - Завод
      - Plant
      - Площадка
    schema_name:
      - OWNER
      - Схема
      - Schema
    table_name:
      - SEGMENT_NAME
      - Таблица
      - Table Name
      - Имя таблицы
    # Тип сегмента: TABLE, TABLE PARTITION, INDEX, LOBSEGMENT и т.п.
    # В размер таблицы попадают только сегменты типа TABLE*.
    segment_type:
      - SEGMENT_TYPE
      - Тип сегмента
    # Альтернатива паре schema_name/table_name: «схема.таблица» одной колонкой.
    full_name:
      - Table
      - Full Name
    total_mb:
      - SIZE_MB
      - Total MB
      - TotalMB
      - Размер МБ
      - Итого МБ
    percent_of_total:
      - PERCENT_OF_TOTAL
      - Доля от общего объёма
    # Глубина хранения данных в таблице, дней. Используется в таблице №5.
    retention_days:
      - Глубина хранения
      - Глубина хранения (дней)
      - Retention
      - Retention Days
      - Хранение, дней
      - Срок хранения
    row_count:
      - Rows
      - Row Count
      - Строк
      - Количество строк
    data_mb:
      - Data MB
      - DataMB
      - Данные МБ
    index_mb:
      - Index MB
      - IndexMB
      - Индексы МБ
    measured_at:
      - Measured At
      - Дата замера
  # Типы сегментов, которые считаются объёмом таблицы. Остальные (индексы,
  # LOB-сегменты) пропускаются: связать их с таблицей по выгрузке нельзя.
  segment_types: ["TABLE", "TABLE PARTITION", "TABLE SUBPARTITION"]

# Отдельный файл со статистикой использования — ЕДИНСТВЕННЫЙ источник
# exec_count и avg_duration_sec. В основном файле отчётов эти колонки не
# читаются, даже если физически присутствуют.
report_usage:
  # Как и выше: допустимы `file:` и `files:`.
  file: null # напр. report_usage.xlsx
  sheet: null
  header_row: 0
  columns:
    report_name:
      - Наименование отчёта
      - Наименование отчета
      - Report
      - Report Name
      - Отчёт
      - Отчет
    network:
      - ТС
      - Торговая сеть
    plant:
      - Завод
      - Plant
    catalog_path: # повышает точность сопоставления при одинаковых именах
      - Каталог
      - Path
      - Путь
    exec_count:
      - Кол-во обращений
      - Количество обращений
      - Executions
      - Exec Count
      - Запусков
    distinct_users:
      - Users
      - Distinct Users
      - Пользователей
    avg_duration_sec:
      - Ср. дл. (сек)
      - Средняя длительность (сек)
      - Avg Duration Sec
    avg_duration_ms:
      - Avg Duration Ms
      - Ср. дл. (мс)
    last_executed_at:
      - Last Executed
      - Последний запуск
    period_start:
      - Period Start
      - Начало периода
    period_end:
      - Period End
      - Конец периода

# Текст SQL-запроса отчёта — необязательный отдельный файл. Сопоставление
# только по имени отчёта: файл обычно не несёт ТС и Завод (запрос — свойство
# определения отчёта, а не конкретной площадки), поэтому текст применяется
# ко всем отчётам с этим именем сразу, сколько бы заводов его ни держало.
report_sql:
  # Как и выше: допустимы `file:` и `files:`.
  file: null # напр. report_sql.xlsx
  sheet: null
  header_row: 0
  columns:
    report_name:
      - Наименование отчёта
      - Наименование отчета
      - Report
      - Report Name
      - Отчёт
      - Отчет
    sql_text:
      - Запрос к базе данных
      - SQL
      - SQL-запрос
      - SQL Query
      - Query
      - Текст запроса
