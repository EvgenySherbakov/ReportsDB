[project]
name = "reportsdb"
version = "1.0.0"
description = "Локальная БД отчётности SSRS и аналитика по ней"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reportsdb = "reportsdb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reportsdb = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
