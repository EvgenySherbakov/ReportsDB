# Тема приложения — тёмная.
#
# backgroundColor обязан совпадать с SURFACE в app/_shared.py: этим цветом
# рисуются зазоры между сегментами диаграмм, и расхождение будет видно как
# светлая или тёмная кайма вокруг долей.
#
# primaryColor — цвет выделения: им подсвечивается выбранная строка в списках.
# По умолчанию Streamlit красит его красным, а красный в этом приложении
# означает проблему, а не выбор.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0f1419"
secondaryBackgroundColor = "#181e26"
textColor = "#e6e9ee"

[browser]
gatherUsageStats = false
